<body>
    <h1>Controle de Peso no Elevador: Segurança em Primeiro Lugar  </h1>
    <span>Peso total num elevador:</span>
    <input type="text" id="peso">
    <button onclick="calcular()">Ligar elevador...</button>
    <div id="exibir"></div>
</body>

<script>

    function calcular () {
        let pesoTotal = Number(peso.value);

        if  (pesoTotal < 500) {
            alert("Elevador vai se mover");
        } else {
            alert("Alguém precisa descer do elevador")
        }
    }
</script>
