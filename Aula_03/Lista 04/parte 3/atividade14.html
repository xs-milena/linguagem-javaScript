<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 14</title>
</head>
<body>
    <h1>Autoescola Inteligente: Você Já Pode Tirar a CNH?</h1>
    <span>Nome:</span>
    <input type="text" id="nomeAluno">
    <span>Idade:</span>
    <input type="text" id="idadeAluno">
    <button onclick="calcular()">Avaliar aluno</button>
    <div id="exibir"></div>
</body>
</html>

<script>
    function calcular() {
        let idade = Number(idadeAluno.value);
        let nome = nomeAluno.value;

        if (idade >= 18) {
            exibir.innerHTML = nome + ", vamos tirar a CNH?";
        } else {
            exibir.innerHTML = nome + ", vai jogar PlayStation!";
        }
    }
</script>
