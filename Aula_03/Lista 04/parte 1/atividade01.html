<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 01</title>
</head>
<body>
    <h1>Idade para a Festa</h1>
    <span>Qual a sua idade?</span>
    <input type="text" id="input_idade">
    <button onclick="mensagem()">Ir para festa</button>
</body>
</html>

<script>
    function mensagem() {
        let idade = Number(input_idade.value);

        if (idade < 18) {
            alert("Peça a permissão do responsável");
        }
        alert("#partiufesta");
    }
</script>
