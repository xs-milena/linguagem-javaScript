<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="verificar()">Verificar Média</button>
    <div id="div_exibir"></div>
    <div id="div_media"></div>
</body>
</html>

<script>
    let num = [];

    function verificar() {
        div_exibir.innerHTML = ``;
        let avaliacao = +((Math.random() * 5).toFixed(1));
        num.push(avaliacao);
        let soma = 0;
        
        for(i= 0; i < num.length; i++) {
            soma += num[i];
            console.log(soma);
        }
            let media = soma / num.length;

            if(media < 6.0) {
                div_media.innerHTML = `Média geral: ${media.toFixed(2)} 😔`
            } else {
                div_media.innerHTML += `Média geral: ${media.toFixed(2)} 😌`;
            }

}
</script>
