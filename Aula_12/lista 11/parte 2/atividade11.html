<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="verificar()">Avaliar</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>

    function verificar() {
        div_exibir.innerHTML = ``;
        let avaliacao = Math.random() * ((5-0) + 0);
        avaliacao = avaliacao.toFixed(1);
        console.log(avaliacao);

        if(avaliacao >=0 && avaliacao <= 0.5){
            div_exibir.innerHTML = `Muito Triste`;
        } else if(avaliacao > 0.5 && avaliacao <= 1.5){
            div_exibir.innerHTML = `Meio Triste`;
        } else if(avaliacao > 1.5 && avaliacao <= 3.5){
            div_exibir.innerHTML = `Neutro`;
        } else if (avaliacao > 3.5 && avaliacao <= 4.5){
            div_exibir.innerHTML = `Feliz`;
        } else {
            div_exibir.innerHTML = `Muito Feliz`;
        }
    }
</script>
