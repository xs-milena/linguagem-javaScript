<!DOCTYPE html>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    img {
        width: 100px;
        height: 100px;
    }
</style>
<body>
    <button onclick="verificar()">Ver a Lua</button>
    <div id="div_exibir">
    </div>
</body>
</html>

<script>
    function verificar(){
        let dia = Math.floor(Math.random() * 31)

        if (dia >=1 && dia <=7){
            div_exibir.innerHTML = `Lua nova <br><img src="lua-nova.png" alt="">`;
        } else if (dia >=8 && dia <=16){
            div_exibir.innerHTML = `Lua cheia <br><img src="lua-cheia.png" alt="">`;
        } else if (dia >=17 && dia <=22){
            div_exibir.innerHTML = `Lua minguante <br><img src="lua-minguante.png" alt="">`;
        } else {
            div_exibir.innerHTML = `Lua crescente <br><img src="lua-crescente.png" alt="">
`;
        }
}
</script>
