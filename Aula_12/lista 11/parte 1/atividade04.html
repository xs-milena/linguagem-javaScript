<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Sortear Nota</h1>
    <button onclick="verificar()">Sortear nota para aluno</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>

    function verificar() {
        let num= Math.random() * (10 - 1) + 1;
        if(num <= 10) {
            div_exibir.innerHTML = `${num.toFixed(1)}`;
        }
    }
</script>
