<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="verificar()">Quero um número cabalístico!</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function verificar() {
        let num = Math.floor(Math.random() * ((15 - 1) * 1));

        div_exibir.innerHTML = `Número: ${num}<br>`;

        if(num == 3 || num == 4 || num == 7 || num == 10 || num == 12) {
            div_exibir.innerHTML += `Eu S2 números cabalísticos!`;
        } else {
            div_exibir.innerHTML += `Ah, me dá um número bom na próxima!`;
        }
    }
</script>
