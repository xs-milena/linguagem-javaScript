<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="sorteio()">Sortear momento do dia</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>

    function sorteio(){
        let hora = Math.floor(Math.random() * 23);

        if (hora >= 0 && hora <=11) {
            div_exibir.innerHTML = `Bom dia, flor do dia, são ${hora}h!`
        }
        if (hora >= 12 && hora <=17) {
            div_exibir.innerHTML = `Boa tarde, já vai tarde! São ${hora}h!`
        }
        if (hora >=18 && hora <= 23){
             div_exibir.innerHTML = `Boa noite, durma bem! São ${hora}h!`
        }
    }
</script>
