<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="exibir()">Exibir Número Aleatório</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function exibir(){
        // // Math.random() - só gera número entre 0 e 1, sendo que 10 não está incluso
        // let numeroAleatorio = Math.random() * 10;
        // div_exibir.innerHTML = `${numeroAleatorio.toFixed(0)}`;

        // Math.random() - só gera número entre 10 e 20 -> Math.random() * (maximo - minimo) + minimo
        let numeroAleatorio = Math.random() * (20 - 10) + 10;
        div_exibir.innerHTML = `${numeroAleatorio}`;
    }
</script>
