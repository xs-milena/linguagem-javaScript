<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Valor da compra: <input type="number" id="input_valor">
    <select id="categorias">
        <option value="estudante" hidden >Selecionar</option>
        <option value="estudante">estudante</option>
        <option value="idoso">idoso</option>
        <option value="professor">professor</option>
        <option value="comum">comum</option>
    </select>
    <button onclick="calculo(input_valor.value)">Calcular</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    const descontos = {
    "estudante": 0.20,
    "idoso":     0.15,
    "professor": 0.10,
    "comum":     0.00
    };

    function calculo(valor) {

        let selecao = categorias.value;
        let desconto = valor * descontos[selecao];
        let valor_final = valor - desconto
        
        if(selecao == "comum") {
            div_exibir.innerHTML = `Não há desconto disponível.<br> Total: R$:${valor_final.toFixed(1)}`;
        } else {
            div_exibir.innerHTML = `Desconto de ${descontos[selecao] * 100}% aplicado!<br> Total: R$: ${valor_final.toFixed(1)}!`
        }
    }
</script>
