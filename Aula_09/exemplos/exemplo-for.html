<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="mostrarMensagem()">Mostrar Mensagem</button>
    <div id="div_while"></div>
    <div id="div_for"></div>
</body>
</html>

<script>

 // WHILE - sei quantas vezes a tarefa será executado
    function mostrarMensagem() {
        let contador = 0;
        div_while.innerHTML = `While: <br>`
        while(contador < 10) {
            div_while.innerHTML += `${contador}<br>`;
            contador ++;
        }

// FOR - nn sei quantas vezes a terefa será executada

        //COLOCANDO O NOME DA VARIÁVEL COMO contador

        /*
          div_for.innerHTML = `For: <br>`
          for(let contador = 0; contador < 10; contador++) { // pode criar tudo dentro do FOR (variáveis, condição do contador e controle do contador )
          div_for.innerHTML += `${contador}<br>`;
          } 
        */


        //COLOCANDO O NOME DA VARIÁVEL COMO i

        div_for.innerHTML = `For: <br>`
        for(let i = 0; i < 10; i++) { //pode criar tudo dentro do FOR (variáveis, condição do contador e controle do contador )
            div_for.innerHTML += `${i}<br>`;
        }
    }
</script>
