<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Múltiplos de 5</h1>
    <span>Digite um número entre 20 e 100</span>
    <input type="text" id="ipt_num">
    <button onclick="verificar()">Adoro múltiplos de 5</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>

   
    function verificar() {
        let num = Number(ipt_num.value);
        let contador = 0;
        let multiplicacao = 0;
        div_exibir.innerHTML = ``;
        
        if(num >= 20 && num <= 100) {
            while(contador < num) {
                contador ++;
                multiplicacao = contador * 5;

                div_exibir.innerHTML += `${multiplicacao} <br>`;
         }
       }    
    }
</script>
