<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Tabuada Colorida</h1>
    <span>Qual tabuada você deseja ver?</span>
    <select  id="ipt_tabuada">
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
    </select>
    <span>Até que número a tabuada deve ir?</span>
    <input type="text" id="ipt_vezes">
    <button onclick="verificar()">Ver Tabuada</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>

    function verificar() {
    let tabuada = ipt_tabuada.value;
    let vezes = ipt_vezes.value;
    let contador = 0;
    let multiplicacao = 0;
    div_exibir.innerHTML = ``;

    while(contador < vezes) {
        contador ++;
        multiplicacao = contador * tabuada;
    if ((contador % 2) == 0) {
        div_exibir.innerHTML += `<span style='color:blue'>${tabuada} x ${contador} = ${multiplicacao} <br>`;
    } else {
        div_exibir.innerHTML += `<span style='color:red'>${tabuada} x ${contador} = ${multiplicacao} <br>`;
    }
    }
}
</script>
