<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Contagem Simples</h1>
    <button onclick="contar()">Contar</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function contar() {
        let contador = 0;
        div_exibir.innerHTML = ``;
        
        while(contador < 15) {
            contador ++;
            div_exibir.innerHTML += `${contador} <br>`; 
        }
    }

</script>
