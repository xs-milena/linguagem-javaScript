<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span>Quantas voltas um carro dar numa corrida?</span>
    <input type="text" id="ipt_voltas">
    <button onclick="verificar()">Iniciar corrida!</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>

    function verificar() {
        let voltas = Number(ipt_voltas.value);
        let contador = 0;
        div_exibir.innerHTML = ``;
        
        while(contador < voltas) {
        contador ++
        div_exibir.innerHTML += `Carro dando a ${contador}º volta <br>`;
        } if (contador == voltas) {
        div_exibir.innerHTML += `Corrida finalizada!`;
        }
    }
</script>
