<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="verificar()">Números cabalísticos</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function verificar(){
      let contador = 0;
      div_exibir.innerHTML = ``;

       while(contador < 30) {
       contador ++;

        if(contador !=3 && contador !=4 && contador != 7 && contador !=10 && contador !=12) {
            div_exibir.innerHTML += `${contador} <br>`;
         }
       }
    }
</script>
