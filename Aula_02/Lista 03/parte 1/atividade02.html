<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 02</title>
</head>
<body>
  <h1>Dividindo a Pizza!</h1>
  <span>Qual o valor da pizza?</span>
  <input type="number" id="input_valor">
  <span>Quantidade de amigos:</span>
  <input type="number" id="input_amigos">
  <button onclick="pizza()">#lovePizza</button>
</body>
</html>

<script>
    function pizza() {
        alert("Cada um dos " + input_amigos.value + " vai pagar R$:" + (Number(input_valor.value) / Number(input_amigos.value)));
    }
</script>
