<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 09</title>
</head>
<body>
    <h1>Calculadora das Fases do Sono</h1>
    <span>Quantas horas de sono você teve?</span>
    <input type="number" id="input_horas">
    <button onclick="calcular()">Calcular sono</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function calcular() {
        let horas = Number(input_horas.value);
        let fase1 = (horas * 0.05);
        let fase2 = (horas * 0.45);
        let fase3 = (horas * 0.30);
        let faseREM = (horas * 0.20);
        div_exibir.innerHTML = "Ao dormir " + horas + " horas você dormiu: <br>" 
        + fase1   + " horas na fase 1 <br>"
        + fase2   + " horas na fase 2 <br>"
        + fase3   + " horas na fase 3 <br>"
        + faseREM + " horas na fase REM <br>";
    }
</script>
