<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 08</title>
</head>
<body>
    <H1>Banco Virtual: Depósitos e Retiradas</H1>
    <span>Valor a ser depositado/retirado:</span>
    <input type="number" id="input_valor">
    <button onclick="depositar()">Depositar</button>
    <button onclick="retirar()">Retirar</button>
</body>
</html>

<script>
    let saldo = 0;

    function depositar() {
        let valor = Number(input_valor.value);
        saldo = saldo + valor;
        alert("Depósito de R$: " + valor + " efetuado! Saldo atual: " + saldo);

    }

    function retirar() {  
        let valor = Number(input_valor.value);
        saldo = saldo - valor;
        alert("Retirada de R$: " + valor + " efetuada! Saldo atual: " + saldo);
    }
</script>
