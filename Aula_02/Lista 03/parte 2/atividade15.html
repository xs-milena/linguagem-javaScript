<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade15</title>
</head>
<body>
    <h1>Calculadora de IMC</h1>
    <span>Peso:</span>
    <input type="text" id="peso">
    <span>Altura:</span>
    <input type="text" id="altura">
    <button onclick="calcular()">Calcular UMC</button>
    <div id="div_exibir"></div>
</body>
</html>

<script>
    function calcular () {
        imc = Number(peso.value) / (Number(altura.value) * Number(altura.value));

        div_exibir.innerHTML = "Seu IMC é: " + imc.toFixed(2);
    }
</script>
