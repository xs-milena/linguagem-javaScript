<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Exemplo 04</title>
</head>
<body>
    <button onclick="exibirMensagem()">Exibir Mensagem</button> <!--declarando a função do script-->
    <span id="span_mensagem"></span> <!-- declaração do id no span, para que a função "saiba" onde aparecer-->
</body>
</html>

<script>
    function exibirMensagem() {
        span_mensagem.innerHTML = "Olá, Mundo!";
    }
</script>
