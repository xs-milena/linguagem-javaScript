<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 03</title>
</head>
<body>
    <h1>Seja bem-vindo!</h1>
    <span>Digite seu nome:</span>
    <input type="text" name="" id="ipt_nome">
    <button onclick="mostrarMensagem()">Mostrar Mensagem</button>
</body>
</html>

<script>
    
//função 01 - tem de estar na caixinha
function mostrarMensagem() {
    alert("Olá! " + ipt_nome.value + ". Seja bem-vindo ao JS!"); //ipt_nome.value significa q vc está atribuindo valor ao q vc escreveu no input
}

</script>
