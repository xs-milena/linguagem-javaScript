<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 02</title>
</head>
<body>
    <h1>Calculadora de Peso e Altura</h1>
    <span>Peso:</span>
    <input type="text" id="input_peso" placeholder="em kg">
    <span>Altura:</span>
    <input type="text" id="input_altura">
    <button onclick="calcular()">Fale comigo</button>
</body>
</html>

<script>
    function calcular() {
        alert("Voce pesa " + input_peso.value + " e tem " + input_altura.value);
    }
</script>
