<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Sistema de Avaliação de Atendimento: Dê Sua Nota! </h1>
    <span>Nota para o atendimento:</span>
    <input type="text" id="ipt_nota">
    <button onclick="verificar()">Avaliar atendimento</button>
    <div id="exibir"></div>
</body>
</html>

<script>
    function verificar () {
        let nota = Number(ipt_nota.value);
        

        if (nota < 0 || nota > 10) {
            exibir.innerHTML = 'Nota inválida';
        } else if (nota >= 0 && nota <5) {
            exibir.innerHTML = 'Não aprovado';
        } else if (nota >=5 && nota <=6) {
            exibir.innerHTML = 'Neutro';
        } else {
            exibir.innerHTML = 'Aprovado';
         }
    }
</script>
