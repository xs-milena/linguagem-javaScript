<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 08</title>
</head>
<body>
    <h1>Meta de Economia: Você Está no Caminho Certo?</h1>
    <span>Sua meta de economia:</span>
    <input id="metaeconomia"></input>
    <span>Quanto você tem guardado:</span>
    <input id="dinheiroguardado"></input>
    <button onclick="verificar()">Analisar economia</button>
    <div id="exibir"></div>
</body>
</html>

<script>

    function verificar(){

        let meta = Number(metaeconomia.value);
        let guardado = Number(dinheiroguardado.value);
        let diferenca1 = meta - guardado;
        let diferenca2 = guardado - meta;
        exibir.innerHTML = " ";
        

        if (guardado == meta) {
            exibir.innerHTML += "Parabéns, meta alcançada!";
        } else if (guardado > meta) {
            exibir.innerHTML += "Parabéns, meta alcançada. <br> Meta ultrapassada em R$: " + diferenca2.toFixed(2);
        } else if (guardado < meta) {
            exibir.innerHTML += "Força! Ainda em busca da meta! Falta R$: " + diferenca1.toFixed(2);
        }
    }
    
</script>
