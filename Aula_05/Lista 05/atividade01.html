<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 01</title>
</head>
<body>
    <h1>Altura e Esportes: Descubra Sua Vantagem Competitiva</h1>
    <span>Altura:</span>
    <input type="text" id="valorAltura">
    <button onclick="verificar()">Analisar Estatura</button>
    <div id="exibir"></div>

</body>
</html>

<script>

    function verificar() {
        let altura = Number(valorAltura.value);

        if (altura < 1.65) {
            exibir.innerHTML = "Você pode ser piloto de corrida.";
        } else if (altura <= 1.80) {
            exibir.innerHTML = "Você pode ser jogador de futebol.";
        } else if (altura >  1.80) {
            exibir.innerHTML = "Você pode ser jogador de vôlei ou basquete.";
        }
    }

</script>
