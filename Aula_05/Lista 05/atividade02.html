<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 02</title>
</head>
<body>
    <h1>Classe Social em Tuvalu: Em Qual Você se Encaixa?</h1>
    <span>Renda familiar mensal:</span>
    <input type="text" id="rendaFamiliar">
    <button onclick="verificar()"> Analisar Renda </button>
    <div id="exibir"></div>
</body>
</html>

<script>

    function verificar() {
        let renda = Number(rendaFamiliar.value);

        if (renda <= 250) {
            exibir.innerHTML = "Classe E";
        } else if (renda < 900) {
            exibir.innerHTML = "Classe D";
        } else if (renda < 2500) {
            exibir.innerHTML = "Classe C"; 
        }else if (renda < 9500) {
            exibir.innerHTML = "Classe B"; 
        }else if (renda > 9500) {
            exibir.innerHTML = "Classe A";
        }
    }

</script>
