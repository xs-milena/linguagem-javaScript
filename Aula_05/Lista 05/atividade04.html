<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 04</title>
</head>
<body>
    <h1>Avaliação de Peso Infantil: Está Dentro da Faixa Saudável?</h1>
    <span>Peso da criança:</span>
    <input type="text" id="pesoCrianca">
    <button onclick="verificar()">Analisar peso</button>
    <div id="exibir"></div>
</body>
</html>

<script>

    function verificar () {
        let peso = Number(pesoCrianca.value);

        if (peso <= 13.5) {
            exibir.innerHTML = "Abaixo do peso";
        } else if (peso > 21.2) {
            exibir.innerHTML = "Acima do peso";
        } else if (peso <= 21.2) {
            exibir.innerHTML = "Peso na média";
        } else if (peso == 18.3) {
            exibir.innerHTML = "Peso perfeito";
        }
    }
</script>
