<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h2>Buscar Filmes:</h2>
  
  <span>Nome:</span>
  <input type="text" id="ipt_nome">
  <button onclick="pesquisarNome()">Pesquisar</button>

  <span>Diretor:</span>
  <input type="text" id="ipt_diretor">
  <button onclick="pesquisarDiretor()">Pesquisar</button>

  <span>Ano:</span>
  <select id="ipt_ano_parametro">
    <option value="maior_igual">&gt;=</option>
    <option value="igual">==</option>
    <option value="menor_igual">&lt;=</option>
  </select>
  <input type="number" id="ipt_ano">
  <button onclick="pesquisarAno()">Pesquisar</button><br><br>

  <span>Gênero:</span>
  <input type="text" id="ipt_genero">
  <button onclick="pesquisarGenero()">Pesquisar</button>

  <span>Média:</span>
  <select id="ipt_media_parametro">
    <option value="maior_igual">&gt;=</option>
    <option value="igual">==</option>
    <option value="menor_igual">&lt;=</option>
  </select>
  <input type="text" id="ipt_media">
  <button onclick="pesquisarMedia()">Pesquisar</button><br><br>

  <button onclick="pesquisar()">Mostrar Todos</button>

  <div id="div_resultado"></div>
</body>
</html>
<script src="dados.js"></script>

<script>

  function pesquisarNome() {
    div_resultado.innerHTML = ``;
    let pesquisar_nome = ipt_nome.value.toUpperCase().trim();

    for(let i = 0; i < filmes.length; i++) { //percorre o vetor

      let nomeFilmes = filmes[i].nome.toUpperCase().trim();

      if(nomeFilmes.includes(pesquisar_nome)) {
        div_resultado.innerHTML += `- ${filmes[i].nome}<br>`
      }
    }
  }
  
  function pesquisarDiretor() {
    div_resultado.innerHTML = ``;
    
    let pesquisar_diretor = ipt_diretor.value.toUpperCase().trim();

    for(let i = 0; i < filmes.length; i++) { //percorre o vet

      let diretorFilmes = filmes[i].diretor.toUpperCase();

      if(diretorFilmes.includes(pesquisar_diretor)) {
        div_resultado.innerHTML += `- ${filmes[i].nome}<br>`
      }
    }
  }

  function pesquisarAno() {
    div_resultado.innerHTML = ``;
    let ano = Number(ipt_ano.value);
    let selecao =  ipt_ano_parametro.value;

    for(i = 0; i < filmes.length; i++) {

      let anoFilmes = filmes[i].ano;

      if(selecao == "maior_igual" &&  anoFilmes >= ano) {
        div_resultado.innerHTML += ` - ${filmes[i].nome} - ${filmes[i].ano}<br>`
      }
      
      if(selecao == "igual" && ano === anoFilmes) {
        div_resultado.innerHTML += ` - ${filmes[i].nome} - ${filmes[i].ano}<br>`
      }
      
      if (selecao == "menor_igual" && anoFilmes <= ano) {
        div_resultado.innerHTML += ` - ${filmes[i].nome} - ${filmes[i].ano}<br>`
      }
    } 
  } 

  function pesquisarGenero() {
    div_resultado.innerHTML = ``;
    
    let pesquisar_genero = ipt_genero.value.toUpperCase();

    for(let i = 0; i < filmes.length; i++) { //percorre o vet
      for(let a = 0; a < filmes[i].generos.length; a++) {
          if(filmes[i].generos[a].toUpperCase().includes(pesquisar_genero)) {
            div_resultado.innerHTML += `- ${filmes[i].nome} - ${filmes[i].generos[a]}<br>`
          }
        }   
    }
  }

  function pesquisarMedia() {
    div_resultado.innerHTML = ``;
    let titulo_media = Number(ipt_media.value);
    let selecao =  ipt_media_parametro.value;
    let soma = 0;

    for(i = 0; i < filmes.length; i++) {

      for(let m = 0; m < filmes[i].notas.length; m++) {
          soma += filmes[i].notas;
      }

      if(selecao == "maior_igual" &&  anoFilmes >= ano) {
        div_resultado.innerHTML += ` - ${filmes[i].nome} - ${filmes[i].ano}<br>`
      }
      
      if(selecao == "igual" && ano === anoFilmes) {
        div_resultado.innerHTML += ` - ${filmes[i].nome} - ${filmes[i].ano}<br>`
      }
      
      if (selecao == "menor_igual" && anoFilmes <= ano) {
        div_resultado.innerHTML += ` - ${filmes[i].nome} - ${filmes[i].ano}<br>`
      }
    } 
  } 
</script>
